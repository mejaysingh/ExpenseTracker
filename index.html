// Account Reset
async function resetAccount(){
  const confirmed=confirm('⚠️ WARNING: This will DELETE ALL your data!\n\n✓ All transactions will be deleted\n✓ All custom accounts & categories will be deleted\n✓ App will reset to default setup\n\nThis action CANNOT be undone.\n\nAre you sure?');
  if(!confirmed)return;

  const doubleConfirm=prompt('Type "RESET" to confirm (case-sensitive):');
  if(doubleConfirm!=='RESET'){
    toast('Reset cancelled');
    return;
  }

  try{
    toast('Resetting account...');
    // Clear all data
    await dbClear('txns');
    await dbClear('accounts');
    await dbClear('cats');
    await dbClear('mappings');

    // Restore defaults
    for(const a of DEF_ACCOUNTS)await dbPut('accounts',a);
    for(const c of DEF_CATS)await dbPut('cats',c);

    // Clear mappings
    paidByMappings={};
    await saveMappings();

    // Reload everything
    txns=[];
    accounts=await dbAll('accounts');
    cats=await dbAll('cats');
    renderAll();
    buildSettings();

    toast('Account reset to default ✓');
  }catch(e){
    console.error('Reset error:',e);
    toast('Reset failed: '+e.message);
  }
}

// PhonePe mapping management
async function updateMapping(idx,field,value){
  if(paidByMappings[idx]){
    paidByMappings[idx][field]=value;
    await saveMappings();
  }
}

async function deleteMapping(idx){
  paidByMappings.splice(idx,1);
  await saveMappings();
  renderAccounts();
  toast('Mapping deleted');
}

async function addMapping(){
  const newId=Math.max(0,...paidByMappings.map(m=>m.id||0))+1;
  paidByMappings.push({id:newId,pattern:'',accountName:'__DEFAULT__'});
  await saveMappings();
  renderAccounts();
}

async function saveMappings(){
  await dbPut('settings',{key:'paidByMappings',value:paidByMappings});
}

async function resetMappings(){
  paidByMappings=[...DEF_PAIDBY_MAPPINGS];
  await saveMappings();
  renderAccounts();
  toast('Mappings reset to defaults');
}

let deferredPrompt=null;

function updateInstallUI(){
  const installBtn=document.getElementById('pwa-install-btn');
  const installedEl=document.getElementById('pwa-installed');
  const manualEl=document.getElementById('pwa-manual');
  if(!installBtn)return; // Settings page not rendered yet
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(isStandalone){
    installBtn.style.display='none';
    manualEl.style.display='none';
    installedEl.style.display='flex';
  } else if(deferredPrompt){
    installBtn.style.display='flex';
    manualEl.style.display='none';
    installedEl.style.display='none';
  } else {
    installBtn.style.display='none';
    installedEl.style.display='none';
    manualEl.style.display='flex';
  }
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  updateInstallUI();
  toast('Tip: Install Paisa as an app! Go to Settings → Install 📲');
});

function triggerInstall(){
  if(!deferredPrompt){toast('Use browser menu → Add to Home Screen');return;}
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(c=>{
    if(c.outcome==='accepted')toast('Paisa installed! ✓');
    deferredPrompt=null;
  });
}

window.addEventListener('appinstalled',()=>{toast('Paisa installed successfully! ✓');});

// Register service worker for PWA offline support
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='paisa-v2';
    const ASSETS=['/'];
    self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll([]))));
    self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('Offline')))));
  `;
  const blob=new Blob([swCode],{type:'text/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

  if(!q.trim()){el.innerHTML='';return;}
  const f=q.toLowerCase();
  const res=txns.filter(t=>(t.description||'').toLowerCase().includes(f)||catBy(t.category).name.toLowerCase().includes(f)).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,40);
  el.innerHTML=res.length?res.map(tRow).join(''):`<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">No results for "${escHtml(q)}"</div></div>`;

function generateAppIcon(size){
  const canvas=document.createElement('canvas');
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  const r=size*0.22;
  // Rounded rect background
  ctx.fillStyle='#0f172a';
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(size-r,0);
  ctx.arcTo(size,0,size,r,r);
  ctx.lineTo(size,size-r);
  ctx.arcTo(size,size,size-r,size,r);
  ctx.lineTo(r,size);
  ctx.arcTo(0,size,0,size-r,r);
  ctx.lineTo(0,r);
  ctx.arcTo(0,0,r,0,r);
  ctx.closePath();ctx.fill();
  // Subtle inner glow ring
  const grad=ctx.createRadialGradient(size/2,size*0.45,size*0.05,size/2,size*0.45,size*0.42);
  grad.addColorStop(0,'rgba(245,158,11,0.18)');
  grad.addColorStop(1,'rgba(245,158,11,0)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(size/2,size/2,size*0.46,0,Math.PI*2);ctx.fill();
  // Emoji 💰
  ctx.font=`${Math.round(size*0.54)}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('💰',size/2,size*0.52);
  return canvas.toDataURL('image/png');
}
